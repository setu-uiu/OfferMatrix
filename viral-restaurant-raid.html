<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Restaurant Raid - OfferMatrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="js/om-store.js"></script>
  <script src="js/om-profile.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pink: #ff1a6e;
      --pink-light: #fff0f5;
      --green: #22c55e;
      --green-light: #dcfce7;
      --red: #ef4444;
      --text: #111827;
      --mid: #4b5563;
      --light: #9ca3af;
      --border: #e5e7eb;
      --bg: #fafafa;
      --white: #fff;
      --font: 'Inter', sans-serif;
      --sb: 240px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      font-family: var(--font);
      cursor: pointer;
      border: none;
      background: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 5px;
    }

    /* ── SIDEBAR ── */
    .sb {
      width: var(--sb);
      min-height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 300;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .sb::-webkit-scrollbar {
      display: none;
    }

    .sb-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 1.2rem 1.4rem;
    }

    .sb-logo-icon {
      width: 36px;
      height: 36px;
      background: var(--pink);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
    }

    .sb-logo-text {
      font-size: 1.3rem;
      font-weight: 800;
      color: #111827;
    }

    .sb-nav {
      flex: 1;
      padding: 1rem 0;
    }

    .sb-group {
      font-size: .7rem;
      font-weight: 700;
      color: var(--light);
      letter-spacing: 1px;
      padding: 1rem 1.4rem .4rem;
      text-transform: uppercase;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .7rem 1.4rem;
      font-size: .9rem;
      font-weight: 600;
      color: var(--mid);
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }

    .sb-item:hover {
      color: var(--pink);
    }

    .sb-item.on {
      background: var(--pink);
      color: #fff;
      border-radius: 10px;
      margin: 0 .8rem;
      padding: .7rem .6rem;
      width: calc(100% - 1.6rem);
    }

    .sb-item.on .sb-ico {
      color: #fff;
    }

    .sb-ico {
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
      color: #6b7280;
      transition: all .2s;
      flex-shrink: 0;
    }

    .sb-badge {
      margin-left: auto;
      font-size: .65rem;
      font-weight: 800;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 50px;
      background: var(--red);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sb-badge.red {
      background: #fff;
      color: var(--red);
      border: 1.5px solid var(--red);
    }

    .sb-red {
      color: var(--red) !important;
    }

    /* ── MAIN CONTENT ── */
    .main {
      margin-left: var(--sb);
      flex: 1;
      display: flex;
      flex-direction: column;
      width: calc(100% - var(--sb));
    }

    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: .8rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tb-title-group {
      display: flex;
      flex-direction: column;
    }

    .tb-page-title {
      font-size: .95rem;
      font-weight: 900;
      color: #111827;
    }

    .tb-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-left: auto;
    }

    .tb-saved {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .85rem;
      font-weight: 600;
      color: var(--mid);
      padding: .5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 50px;
      cursor: pointer;
    }

    .tb-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: .5rem;
    }

    .tb-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .container {
      padding: 1.5rem;
      max-width: 1050px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Statistics Banner */
    .stats-banner {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
      border: 1px solid #7dd3fc;
      border-radius: 20px;
      padding: 1.5rem;
    }

    .stat-box {
      text-align: center;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 900;
      color: #0284c7;
    }

    .stat-lbl {
      font-size: .78rem;
      font-weight: 700;
      color: var(--mid);
      margin-top: 2px;
    }

    /* Filter Pills */
    .filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .pills {
      display: flex;
      gap: .6rem;
    }

    .pill {
      padding: .45rem 1.1rem;
      border-radius: 50px;
      font-size: .78rem;
      font-weight: 700;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--mid);
      transition: all .2s;
    }

    .pill:hover {
      border-color: #0284c7;
      color: #0284c7;
    }

    .pill.on {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
    }

    .btn-complain {
      background: #0284c7;
      color: #fff;
      font-weight: 800;
      font-size: .8rem;
      padding: .65rem 1.3rem;
      border-radius: 50px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    /* Grid of Cards */
    .raids-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .raid-card {
      background: #fff;
      border: 1px solid #bae6fd;
      border-radius: 20px;
      padding: 1.4rem;
      display: flex;
      gap: 1.4rem;
      align-items: flex-start;
      box-shadow: 0 4px 20px rgba(0,0,0,0.01);
      transition: transform .2s, border-color .2s;
    }

    .raid-card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    .raid-img {
      width: 120px;
      height: 120px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #bae6fd;
    }

    .raid-info {
      flex: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .status-badge {
      font-size: .65rem;
      font-weight: 800;
      background: #e0f2fe;
      color: #0284c7;
      border: 1px solid #bae6fd;
      padding: 3px 10px;
      border-radius: 50px;
      text-transform: uppercase;
    }

    .raid-date {
      font-size: .72rem;
      color: var(--light);
      font-weight: 600;
    }

    .restaurant-name {
      font-size: 1.15rem;
      font-weight: 900;
      color: #111827;
      margin-bottom: 2px;
    }

    .viral-dish-tag {
      font-size: .78rem;
      font-weight: 800;
      color: #0284c7;
      margin-bottom: 8px;
    }

    .violation-details {
      font-size: .82rem;
      color: var(--mid);
      line-height: 1.45;
      margin-bottom: .8rem;
    }

    .findings-pills {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .finding-pill {
      font-size: .68rem;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid #bae6fd;
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sb">
    <div class="sb-logo">
      <div class="sb-logo-icon">%</div>
      <span class="sb-logo-text">Offer<span style="color:#22c55e">Matrix</span></span>
    </div>
    <nav class="sb-nav">
      <div class="sb-group">MAIN</div>
      <button class="sb-item" onclick="window.location.href='dashboard.html'"><span class="sb-ico">&#127968;</span> Dashboard</button>
      <button class="sb-item" onclick="window.location.href='dashboard.html?tab=food'"><span class="sb-ico">&#127860;</span> Food</button>
      <button class="sb-item" onclick="window.location.href='dashboard.html?tab=ride'"><span class="sb-ico">&#128663;</span> Ride</button>
      <button class="sb-item" onclick="window.location.href='skincare.html'"><span class="sb-ico">&#128167;</span> Skincare</button>
      <button class="sb-item" onclick="window.location.href='orders.html'"><span class="sb-ico">&#128230;</span> Orders <span class="sb-badge sb-badge-orders">6</span></button>
      <button class="sb-item" onclick="window.location.href='saved-deals.html'"><span class="sb-ico">&#10084;</span> Saved Deals <span class="sb-badge sb-badge-saved">6</span></button>
      <button class="sb-item" onclick="window.location.href='price-alerts.html'"><span class="sb-ico">&#128276;</span> Price Alerts <span class="sb-badge sb-badge-alerts">5</span></button>
      <button class="sb-item" onclick="window.location.href='coupons.html'"><span class="sb-ico">&#127915;</span> Coupons</button>
      <button class="sb-item" onclick="window.location.href='reviews.html'"><span class="sb-ico">&#11088;</span> Reviews</button>

      <div class="sb-group">COMMUNITY</div>
      <button class="sb-item sb-red on"><span class="sb-ico">&#128680;</span> <span id="sb-complaint-label">Viral Restaurant Raid</span> <span class="sb-badge red">Alert</span></button>
      <button class="sb-item" onclick="window.OMWallet && window.OMWallet.open('food')"><span class="sb-ico">&#128179;</span> My Wallet</button>
      <button class="sb-item" onclick="window.OMBankCards && window.OMBankCards.open()"><span class="sb-ico">&#128179;</span> Bank Cards</button>
      <button class="sb-item" onclick="window.OMReferral && window.OMReferral.open()"><span class="sb-ico">&#127873;</span> Refer &amp; Earn</button>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tb-title-group">
        <div class="tb-page-title">Viral Restaurant Raid Monitor</div>
      </div>
      <div class="tb-actions">
        <div class="tb-saved" onclick="window.location.href='saved-deals.html'">
          &#10084; Saved (<span id="saved-deals-count">6</span>)
        </div>
        <div class="tb-user">
          <img class="tb-avatar" src="https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&w=100" alt="avatar" />
          <div style="display:flex;flex-direction:column">
            <span style="font-size:.8rem;font-weight:800" class="tb-uname">Setu Meherunnesa</span>
            <span style="font-size:.65rem;color:var(--light);font-weight:700">Premium Member</span>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <!-- Statistics Banner -->
      <div class="stats-banner">
        <div class="stat-box">
          <div class="stat-val">৳4,50,000+</div>
          <div class="stat-lbl">Total Fines Imposed</div>
        </div>
        <div class="stat-box" style="border-left:1px solid #7dd3fc;border-right:1px solid #7dd3fc">
          <div class="stat-val">14 Outlets</div>
          <div class="stat-lbl">Restaurants Inspected</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">3 sealed</div>
          <div class="stat-lbl">Kitchens Sealed</div>
        </div>
      </div>

      <!-- Filters & Complain Button -->
      <div class="filter-row">
        <div class="pills">
          <button class="pill on" onclick="filterRaids('all', this)">All Outlets</button>
          <button class="pill" onclick="filterRaids('Dhanmondi', this)">Dhanmondi</button>
          <button class="pill" onclick="filterRaids('Gulshan', this)">Gulshan</button>
          <button class="pill" onclick="filterRaids('Banani', this)">Banani</button>
          <button class="pill" onclick="filterRaids('Uttara', this)">Uttara</button>
        </div>
        <button class="btn-complain" onclick="openFoodSafetyModal()">+ File Food Safety Complain</button>
      </div>

      <!-- Cards Container -->
      <div id="raids-container" class="raids-grid">
        <!-- Dynamically Rendered -->
      </div>
    </div>
  </div>

  <!-- FILE COMPLAINT MODAL -->
  <div id="modal-food-safety" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:20px;padding:1.8rem;width:90%;max-width:480px;box-shadow:0 10px 30px rgba(0,0,0,0.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;">
        <h3 style="font-size:1.1rem;font-weight:800;color:#111827">File Food Safety Complain</h3>
        <button onclick="closeFoodSafetyModal()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:#9ca3af">&times;</button>
      </div>
      <form id="form-food-safety" onsubmit="submitFoodSafetyForm(event)">
        <div style="margin-bottom:1rem">
          <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Restaurant Name &amp; Location Tag</label>
          <input id="fs-input-name" type="text" required placeholder="e.g. Sultan's Kacchi" style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem"/>
        </div>
        <div style="display:flex;gap:1rem;margin-bottom:1rem">
          <div style="flex:1">
            <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Branch / Outlet Area</label>
            <input id="fs-input-branch" type="text" required placeholder="e.g. Dhanmondi / Gulshan" style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem"/>
          </div>
          <div style="flex:1">
            <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Viral Food Item</label>
            <input id="fs-input-dish" type="text" required placeholder="e.g. Mutton Biryani / Burger" style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem"/>
          </div>
        </div>
        <div style="margin-bottom:1rem">
          <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Unhygienic Conditions / Findings</label>
          <textarea id="fs-input-desc" required rows="3" placeholder="Describe unhygienic practices, spoiled food, or foreign objects found..." style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem;resize:none"></textarea>
        </div>
        <div style="margin-bottom:1.4rem">
          <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Image / Video Proof Attachment</label>
          <input type="file" accept="image/*,video/*" style="width:100%;font-size:.85rem;color:#475569"/>
        </div>
        <button type="submit" style="width:100%;padding:.75rem;font-size:.9rem;background:#0284c7;color:#fff;border:none;border-radius:50px;font-weight:800;cursor:pointer">Submit Food Safety Report</button>
      </form>
    </div>
  </div>

  <script>
    var currentActiveArea = 'all';

    function renderRaids() {
      const container = document.getElementById('raids-container');
      if (!container || !window.OMStore) return;

      const list = window.OMStore.getFoodRaids();
      const filtered = currentActiveArea === 'all' 
        ? list 
        : list.filter(r => r.branchLocation.toLowerCase().includes(currentActiveArea.toLowerCase()));

      container.innerHTML = filtered.map(item => `
        <div class="raid-card">
          <img class="raid-img" src="${item.img}" alt="${item.restaurantName}"/>
          <div class="raid-info">
            <div class="card-top">
              <span class="status-badge">&#128680; STATUS: ${item.closureNotice.toUpperCase()}</span>
              <span class="raid-date">${item.date}</span>
            </div>
            <h3 class="restaurant-name">${item.restaurantName} <span style="font-size:.85rem;color:var(--mid);font-weight:700">(${item.branchLocation})</span></h3>
            <div class="viral-dish-tag">Viral Dish: ${item.viralFoodItem}</div>
            <div class="violation-details">
              <b>Magistrate Report:</b> ${item.magistrateReport}<br/>
              <b>Penalty Fine:</b> <span style="color:#0284c7;font-weight:900">${item.fineAmount}</span>
            </div>
            <div class="findings-pills">
              ${(item.inspectionFindings || []).map(f => `<span class="finding-pill">&bull; ${f}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterRaids(area, btn) {
      currentActiveArea = area;
      document.querySelectorAll('.pills .pill').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      renderRaids();
    }

    function openFoodSafetyModal() {
      document.getElementById('modal-food-safety').style.display = 'flex';
    }

    function closeFoodSafetyModal() {
      document.getElementById('modal-food-safety').style.display = 'none';
    }

    function submitFoodSafetyForm(e) {
      e.preventDefault();
      const restaurantName = document.getElementById('fs-input-name').value;
      const branchLocation = document.getElementById('fs-input-branch').value;
      const viralFoodItem = document.getElementById('fs-input-dish').value;
      const desc = document.getElementById('fs-input-desc').value;

      if (window.OMStore) {
        window.OMStore.fileFoodSafetyComplain({
          restaurantName,
          branchLocation,
          viralFoodItem,
          findings: [desc]
        });
        closeFoodSafetyModal();
        document.getElementById('form-food-safety').reset();
        renderRaids();
        alert('Food safety complaint filed successfully! Mobile court inspectors notified.');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      var params = new URLSearchParams(window.location.search);
      var catParam = params.get('cat');
      if (catParam === 'food' || !catParam) {
        document.body.classList.add('food-sky-theme');
      }
      renderRaids();
      if (window.OMStore) {
        window.OMStore.updateBadges();
        const savedCount = window.OMStore.getSavedDeals().length;
        const elem = document.getElementById('saved-deals-count');
        if (elem) elem.textContent = savedCount;
      }
    });
  </script>
</body>
</html>
