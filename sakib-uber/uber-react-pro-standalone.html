<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uber Pro (React Edition) - 3-in-1 Platform</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-map-pin { display: flex; align-items: center; justify-content: center; color: #fff; border-radius: 50%; font-weight: 800; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .pin-pickup { background-color: #000; border: 2px solid #fff; }
    .pin-dest { background-color: #ef4444; border: 2px solid #fff; border-radius: 4px; }
    .custom-car-marker { font-size: 24px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(0, 168, 89, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(0, 168, 89, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 168, 89, 0); } }
    .pulse-green-dot { animation: pulseGlow 1.8s infinite; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-black selection:text-white dark:bg-neutral-950 dark:text-neutral-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // --- CONTEXT & STATE ENGINE ---
    const DEFAULT_PRICING = {
      storeDiscount: 10,
      couponCode: 'KIREI10',
      bkashCashback: 150,
      shippingCost: 0,
      salePrice: 2050,
    };

    const DEFAULT_COUPONS = [
      { code: 'KIREI10', discount: 10, maxCap: 150, status: 'Active', title: '10% Platform Discount' },
      { code: 'UBER50', discount: 50, maxCap: 180, status: 'Active', title: '50% First Rides Offer' },
      { code: 'AIRPORT100', discount: 25, maxCap: 100, status: 'Active', title: '৳ 100 Airport Saver' },
      { code: 'COMFORT20', discount: 20, maxCap: 120, status: 'Active', title: '20% Luxury Comfort' },
      { code: 'MOTO30', discount: 30, maxCap: 50, status: 'Active', title: '৳ 30 Off Uber Moto' },
    ];

    const VEHICLE_RATES = {
      uberx: { name: 'UberX', base: 120, perKm: 24, capacity: '4 seats', eta: '3 mins away', icon: '🚗' },
      comfort: { name: 'Uber Comfort', base: 160, perKm: 32, capacity: '4 seats', eta: '5 mins away', icon: '🚙' },
      uberxl: { name: 'UberXL', base: 220, perKm: 42, capacity: '6 seats', eta: '6 mins away', icon: '🚐' },
      black: { name: 'Uber Black', base: 350, perKm: 55, capacity: '4 seats', eta: '8 mins away', icon: '🚘' },
      moto: { name: 'Uber Moto', base: 50, perKm: 10, capacity: '1 seat', eta: '2 mins away', icon: '🏍️' },
    };

    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [theme, setTheme] = useState(() => localStorage.getItem('uber_react_theme') || 'light');
      const [currentScreen, setCurrentScreen] = useState('auth');
      const [selectedAuthRole, setSelectedAuthRole] = useState('customer');

      const [adminPricing, setAdminPricing] = useState(() => {
        try {
          const saved = localStorage.getItem('uber_react_pricing');
          return saved ? { ...DEFAULT_PRICING, ...JSON.parse(saved) } : DEFAULT_PRICING;
        } catch { return DEFAULT_PRICING; }
      });

      const [coupons, setCoupons] = useState(() => {
        try {
          const saved = localStorage.getItem('uber_react_coupons');
          const list = saved ? JSON.parse(saved) : DEFAULT_COUPONS;
          if (list.length > 0) {
            list[0].code = adminPricing.couponCode;
            list[0].discount = adminPricing.storeDiscount;
            list[0].maxCap = adminPricing.bkashCashback;
          }
          return list;
        } catch { return DEFAULT_COUPONS; }
      });

      const [customer, setCustomer] = useState(() => ({
        name: 'Nazmus Sakib',
        phone: '+880 1711-234567',
        walletBalance: parseFloat(localStorage.getItem('uber_react_wallet')) || 550.00,
        appliedCoupon: null,
      }));

      const [driver, setDriver] = useState(() => ({
        name: 'Mohammad Rafiq',
        car: 'Silver Toyota Corolla (DHA-GA-11-8492)',
        isOnline: true,
        todayEarnings: parseFloat(localStorage.getItem('uber_react_driver_earnings')) || 3450.00,
        tripsCompleted: parseInt(localStorage.getItem('uber_react_driver_trips')) || 12,
      }));

      const [disputes, setDisputes] = useState(() => [
        {
          id: 'TKT-9201',
          userName: 'Nazmus Sakib (Customer)',
          userPhone: '+880 1711-234567',
          tripId: 'TRIP-8492 (Gulshan ➔ Airport)',
          category: 'Driver Overcharged',
          details: 'Driver took Mohakhali flyover traffic route instead of expressway and charged extra ৳ 120.',
          status: 'PENDING',
          refundAmount: 120.00,
          adminNote: '',
          date: '10 mins ago'
        },
        {
          id: 'TKT-8842',
          userName: 'Tanvir Ahmed (Customer)',
          userPhone: '+880 1819-987654',
          tripId: 'TRIP-7921 (Dhanmondi ➔ Banani)',
          category: 'AC Broken',
          details: 'Car AC was completely non-functional on Uber Comfort.',
          status: 'RESOLVED',
          refundAmount: 80.00,
          adminNote: 'Verified vehicle AC telemetry. Refunded ৳ 80 to rider wallet.',
          date: 'Yesterday'
        }
      ]);

      const [route, setRoute] = useState({
        pickup: { name: 'Gulshan 2, Dhaka', lat: 23.7925, lng: 90.4078 },
        dest: { name: 'Hazrat Shahjalal Int. Airport', lat: 23.8433, lng: 90.4039 },
        distanceKm: 11.4,
        durationMins: 28,
        selectedCar: 'uberx',
      });

      const [toasts, setToasts] = useState([]);

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('uber_react_theme', theme);
      }, [theme]);

      const showToast = (message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3200);
      };

      const toggleTheme = () => {
        setTheme(prev => prev === 'light' ? 'dark' : 'light');
      };

      const enterPortal = (role) => {
        setSelectedAuthRole(role);
        setCurrentScreen(role);
        showToast(`Signed in to ${role.toUpperCase()} portal`);
      };

      const logOutToGate = () => {
        setCurrentScreen('auth');
        showToast('Logged out');
      };

      const updateAdminPricing = (newPricing) => {
        setAdminPricing(newPricing);
        localStorage.setItem('uber_react_pricing', JSON.stringify(newPricing));
        setCoupons(prev => {
          const updated = [...prev];
          if (updated.length > 0) {
            updated[0] = {
              ...updated[0],
              code: newPricing.couponCode,
              discount: newPricing.storeDiscount,
              maxCap: newPricing.bkashCashback,
              title: `${newPricing.storeDiscount}% Platform Discount`
            };
          }
          localStorage.setItem('uber_react_coupons', JSON.stringify(updated));
          return updated;
        });
      };

      const addCoupon = (code, discount, maxCap) => {
        const newCoupon = {
          code: code.toUpperCase(),
          discount: parseFloat(discount),
          maxCap: parseFloat(maxCap) || 150,
          status: 'Active',
          title: `${discount}% Promo Discount`
        };
        setCoupons(prev => {
          const updated = [newCoupon, ...prev];
          localStorage.setItem('uber_react_coupons', JSON.stringify(updated));
          return updated;
        });
        showToast(`🎟️ Coupon "${code.toUpperCase()}" published!`);
      };

      const deleteCoupon = (idx) => {
        setCoupons(prev => {
          const updated = prev.filter((_, i) => i !== idx);
          localStorage.setItem('uber_react_coupons', JSON.stringify(updated));
          return updated;
        });
        showToast('Coupon deleted');
      };

      const applyCoupon = (c) => {
        setCustomer(prev => ({ ...prev, appliedCoupon: c }));
        showToast(`🎉 Coupon ${c.code} applied!`);
      };

      const removeCoupon = () => {
        setCustomer(prev => ({ ...prev, appliedCoupon: null }));
        showToast('Coupon removed');
      };

      const topupWallet = (amt) => {
        setCustomer(prev => {
          const newBal = prev.walletBalance + amt;
          localStorage.setItem('uber_react_wallet', newBal);
          return { ...prev, walletBalance: newBal };
        });
        showToast(`৳ ${amt} added to Uber Cash!`);
      };

      const submitComplaint = (cat, trip, det) => {
        const ticket = {
          id: `TKT-${Math.floor(1000 + Math.random() * 9000)}`,
          userName: customer.name,
          userPhone: customer.phone,
          tripId: trip,
          category: cat,
          details: det,
          status: 'PENDING',
          refundAmount: 120.00,
          adminNote: '',
          date: 'Just now'
        };
        setDisputes(prev => [ticket, ...prev]);
        showToast('✅ Complaint submitted to Admin HQ!');
      };

      const resolveDispute = (id, refund) => {
        const refundAmt = parseFloat(refund) || 0;
        setDisputes(prev => prev.map(d => d.id === id ? { ...d, status: 'RESOLVED', refundAmount: refundAmt } : d));
        setCustomer(prev => {
          const newBal = prev.walletBalance + refundAmt;
          localStorage.setItem('uber_react_wallet', newBal);
          return { ...prev, walletBalance: newBal };
        });
        showToast(`✅ Dispute resolved! ৳ ${refundAmt} refunded to wallet.`);
      };

      const toggleDriverOnline = () => {
        setDriver(prev => {
          const next = !prev.isOnline;
          showToast(next ? 'ONLINE' : 'OFFLINE');
          return { ...prev, isOnline: next };
        });
      };

      const acceptDriverTrip = (fare = 342.00) => {
        setDriver(prev => {
          const newEarn = prev.todayEarnings + fare;
          const newTrips = prev.tripsCompleted + 1;
          localStorage.setItem('uber_react_driver_earnings', newEarn);
          localStorage.setItem('uber_react_driver_trips', newTrips);
          return { ...prev, todayEarnings: newEarn, tripsCompleted: newTrips };
        });
        showToast('Trip accepted!');
      };

      const calculateFare = (carKey) => {
        const rate = VEHICLE_RATES[carKey];
        if (!rate) return { originalFare: 0, finalFare: 0 };
        const dist = route.distanceKm;
        const p = adminPricing;
        const originalFare = Math.round(rate.base + (dist * rate.perKm) + p.shippingCost);
        let discountAmt = Math.round(originalFare * (p.storeDiscount / 100));
        let finalFare = Math.max(40, originalFare - discountAmt);
        if (customer.appliedCoupon) {
          const c = customer.appliedCoupon;
          const extra = Math.min(c.maxCap, Math.round(finalFare * (c.discount / 100)));
          finalFare = Math.max(30, finalFare - extra);
        }
        return { originalFare, finalFare };
      };

      return (
        <AppContext.Provider value={{
          theme, toggleTheme, currentScreen, selectedAuthRole, enterPortal, logOutToGate,
          adminPricing, updateAdminPricing, coupons, addCoupon, deleteCoupon,
          customer, applyCoupon, removeCoupon, topupWallet, submitComplaint,
          driver, toggleDriverOnline, acceptDriverTrip,
          disputes, resolveDispute, route, setRoute, calculateFare, toasts
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // --- NAVBAR ---
    const Navbar = () => {
      const { currentScreen, theme, toggleTheme, logOutToGate, customer, driver } = useApp();
      return (
        <header className="sticky top-0 z-40 w-full border-b border-gray-200 bg-white shadow-sm dark:border-neutral-800 dark:bg-neutral-900">
          <div className="mx-auto flex h-16 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
            <div className="flex items-center gap-3">
              <span className="text-2xl font-black tracking-tight text-black dark:text-white">Uber</span>
              {currentScreen === 'admin' && <span className="rounded-full bg-black px-2.5 py-0.5 text-[10px] font-black uppercase text-white dark:bg-white dark:text-black">ADMIN HQ</span>}
              {currentScreen === 'driver' && <span className="rounded-full bg-emerald-600 px-2.5 py-0.5 text-[10px] font-black uppercase text-white">DRIVER PORTAL</span>}
              {currentScreen === 'customer' && <span className="hidden sm:inline-block rounded-full bg-gray-100 px-2.5 py-0.5 text-[10px] font-bold text-gray-700 dark:bg-neutral-800 dark:text-neutral-300">DHAKA PLATFORM</span>}
            </div>
            <div className="flex items-center gap-3">
              <button onClick={toggleTheme} className="flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 bg-gray-50 text-sm dark:border-neutral-700 dark:bg-neutral-800">
                {theme === 'light' ? '🌙' : '☀️'}
              </button>
              <div className="flex items-center gap-2 rounded-full border border-gray-200 bg-gray-50 px-3 py-1 text-xs font-semibold dark:border-neutral-700 dark:bg-neutral-800">
                <span>{currentScreen === 'admin' ? '🛡️ Super Admin' : currentScreen === 'driver' ? `🚗 ${driver.name}` : `👤 ${customer.name}`}</span>
              </div>
              <button onClick={logOutToGate} className="flex items-center gap-1.5 rounded-full border border-red-200 bg-red-50 px-3.5 py-1.5 text-xs font-bold text-red-600 hover:bg-red-100 dark:border-red-900/40 dark:bg-red-950/40 dark:text-red-400">
                <span>🚪 Log Out</span>
              </button>
            </div>
          </div>
        </header>
      );
    };

    // --- AUTH GATE ---
    const AuthGate = () => {
      const { selectedAuthRole, enterPortal, theme, toggleTheme } = useApp();
      const [role, setRole] = useState('customer');
      const [acc, setAcc] = useState('+880 1711-234567');

      const selectRole = (r) => {
        setRole(r);
        if (r === 'customer') setAcc('+880 1711-234567');
        else if (r === 'driver') setAcc('+880 1819-987654');
        else if (r === 'admin') setAcc('admin@uber.com');
      };

      return (
        <div className="relative flex min-h-screen w-full items-center justify-center bg-gradient-to-b from-gray-100 to-gray-50 p-4 sm:p-6 dark:from-neutral-950 dark:to-neutral-900">
          <div className="absolute top-6 right-6">
            <button onClick={toggleTheme} className="flex h-10 w-10 items-center justify-center rounded-full border border-gray-200 bg-white shadow-sm dark:border-neutral-800 dark:bg-neutral-800">
              {theme === 'light' ? '🌙' : '☀️'}
            </button>
          </div>
          <div className="w-full max-w-lg space-y-6">
            <div className="text-center">
              <h1 className="text-4xl font-black tracking-tighter text-black dark:text-white">Uber</h1>
              <p className="mt-1 text-sm font-semibold text-gray-500 dark:text-neutral-400">Ride, Drive & Company HQ • React Edition</p>
            </div>
            <div className="rounded-3xl border border-gray-200 bg-white p-6 shadow-xl sm:p-8 dark:border-neutral-800 dark:bg-neutral-900">
              <h2 className="text-xl font-extrabold text-gray-900 dark:text-white mb-1">Select Your Portal</h2>
              <p className="text-xs text-gray-500 dark:text-neutral-400 mb-5">Choose your login account type:</p>
              <div className="space-y-3">
                <div onClick={() => selectRole('customer')} className={`flex cursor-pointer items-center justify-between rounded-2xl border-2 p-3.5 ${role === 'customer' ? 'border-black bg-gray-50 dark:border-white dark:bg-neutral-800' : 'border-gray-200 dark:border-neutral-800'}`}>
                  <div className="flex items-center gap-3">
                    <span className="flex h-10 w-10 items-center justify-center rounded-full bg-black text-white dark:bg-white dark:text-black">👤</span>
                    <div>
                      <h3 className="text-sm font-bold text-gray-900 dark:text-white">Customer (Passenger)</h3>
                      <p className="text-xs text-gray-500">Book rides & promo codes</p>
                    </div>
                  </div>
                  <div className={`h-5 w-5 rounded-full border flex items-center justify-center ${role === 'customer' ? 'bg-black text-white dark:bg-white dark:text-black' : ''}`}>{role === 'customer' && '✓'}</div>
                </div>
                <div onClick={() => selectRole('driver')} className={`flex cursor-pointer items-center justify-between rounded-2xl border-2 p-3.5 ${role === 'driver' ? 'border-black bg-gray-50 dark:border-white dark:bg-neutral-800' : 'border-gray-200 dark:border-neutral-800'}`}>
                  <div className="flex items-center gap-3">
                    <span className="flex h-10 w-10 items-center justify-center rounded-full bg-blue-600 text-white">🚗</span>
                    <div>
                      <h3 className="text-sm font-bold text-gray-900 dark:text-white">Driver Partner</h3>
                      <p className="text-xs text-gray-500">Accept trips & track earnings</p>
                    </div>
                  </div>
                  <div className={`h-5 w-5 rounded-full border flex items-center justify-center ${role === 'driver' ? 'bg-black text-white dark:bg-white dark:text-black' : ''}`}>{role === 'driver' && '✓'}</div>
                </div>
                <div onClick={() => selectRole('admin')} className={`flex cursor-pointer items-center justify-between rounded-2xl border-2 p-3.5 ${role === 'admin' ? 'border-black bg-gray-50 dark:border-white dark:bg-neutral-800' : 'border-gray-200 dark:border-neutral-800'}`}>
                  <div className="flex items-center gap-3">
                    <span className="flex h-10 w-10 items-center justify-center rounded-full bg-emerald-600 text-white">🛡️</span>
                    <div>
                      <h3 className="text-sm font-bold text-gray-900 dark:text-white">Company Admin HQ</h3>
                      <p className="text-xs text-gray-500">Pricing inputs & promo manager</p>
                    </div>
                  </div>
                  <div className={`h-5 w-5 rounded-full border flex items-center justify-center ${role === 'admin' ? 'bg-black text-white dark:bg-white dark:text-black' : ''}`}>{role === 'admin' && '✓'}</div>
                </div>
              </div>

              <form onSubmit={(e) => { e.preventDefault(); enterPortal(role); }} className="mt-6 space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-neutral-300">{role === 'admin' ? 'Admin Email' : 'Mobile Number'}</label>
                  <input type="text" value={acc} onChange={e => setAcc(e.target.value)} required className="mt-1 w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-2.5 text-sm font-semibold dark:border-neutral-700 dark:bg-neutral-800 dark:text-white" />
                </div>
                <button type="submit" className="w-full rounded-xl bg-black py-3.5 text-sm font-bold text-white shadow-lg dark:bg-white dark:text-black">
                  Sign In to {role.toUpperCase()}
                </button>
              </form>

              <div className="mt-6 border-t border-gray-200 pt-4 dark:border-neutral-800">
                <span className="block text-[11px] font-bold text-gray-400">⚡ 1-Click Fast Quick Demo Login:</span>
                <div className="mt-2 flex flex-wrap gap-2">
                  <button onClick={() => enterPortal('customer')} className="rounded-full border px-3 py-1.5 text-xs font-bold bg-gray-50 dark:bg-neutral-800">🧑‍💼 Customer</button>
                  <button onClick={() => enterPortal('driver')} className="rounded-full border px-3 py-1.5 text-xs font-bold bg-gray-50 dark:bg-neutral-800">👨‍✈️ Driver</button>
                  <button onClick={() => enterPortal('admin')} className="rounded-full border px-3 py-1.5 text-xs font-bold bg-gray-50 dark:bg-neutral-800">🛡️ Admin HQ</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- LEAFLET MAP COMPONENT ---
    const LiveMap = () => {
      const { route, adminPricing } = useApp();
      const mapRef = useRef(null);

      useEffect(() => {
        if (!mapRef.current) return;
        const map = L.map(mapRef.current, { zoomControl: false, attributionControl: false }).setView([23.8103, 90.4125], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        const pickupIcon = L.divIcon({ className: 'custom-map-pin pin-pickup', html: '●', iconSize: [20, 20] });
        const destIcon = L.divIcon({ className: 'custom-map-pin pin-dest', html: '■', iconSize: [20, 20] });

        L.marker([route.pickup.lat, route.pickup.lng], { icon: pickupIcon }).addTo(map);
        L.marker([route.dest.lat, route.dest.lng], { icon: destIcon }).addTo(map);

        const midLat = (route.pickup.lat + route.dest.lat) / 2 + 0.006;
        const midLng = (route.pickup.lng + route.dest.lng) / 2 - 0.008;

        L.polyline([[route.pickup.lat, route.pickup.lng], [midLat, midLng], [route.dest.lat, route.dest.lng]], {
          color: '#000000', weight: 5, dashArray: '6, 6'
        }).addTo(map);

        const bounds = L.latLngBounds([[route.pickup.lat, route.pickup.lng], [route.dest.lat, route.dest.lng]]);
        map.fitBounds(bounds, { padding: [50, 50] });

        return () => map.remove();
      }, [route]);

      return (
        <div className="relative h-full min-h-[580px] w-full overflow-hidden rounded-3xl border border-gray-200 shadow-md dark:border-neutral-800">
          <div ref={mapRef} className="h-full w-full" />
          <div className="absolute top-4 left-4 right-4 z-[400] flex justify-between pointer-events-none">
            <div className="flex items-center gap-2 rounded-full bg-white/90 px-4 py-2 text-xs font-bold shadow-md dark:bg-neutral-900/90 dark:text-white">
              <span className="h-2 w-2 rounded-full bg-emerald-500 pulse-green-dot" />
              <span>Dhaka Live Fleet: 42 Cars active near Gulshan</span>
            </div>
          </div>
          <div className="absolute bottom-4 left-4 right-4 z-[400] flex items-center justify-around rounded-2xl bg-white/95 py-3 px-4 shadow-xl dark:bg-neutral-900/95">
            <div className="text-center">
              <span className="block text-[10px] font-bold text-gray-400">Distance</span>
              <strong className="text-sm font-extrabold">{route.distanceKm} km</strong>
            </div>
            <div className="h-7 w-px bg-gray-200 dark:bg-neutral-800" />
            <div className="text-center">
              <span className="block text-[10px] font-bold text-gray-400">Duration</span>
              <strong className="text-sm font-extrabold">{route.durationMins} mins</strong>
            </div>
            <div className="h-7 w-px bg-gray-200 dark:bg-neutral-800" />
            <div className="text-center">
              <span className="block text-[10px] font-bold text-gray-400">bKash Cashback</span>
              <strong className="text-sm font-extrabold text-emerald-600">৳ {adminPricing.bkashCashback}</strong>
            </div>
          </div>
        </div>
      );
    };

    // --- CUSTOMER PORTAL ---
    const CustomerPortal = () => {
      const { customer, adminPricing, removeCoupon, calculateFare, coupons, applyCoupon, topupWallet, disputes, submitComplaint } = useApp();
      const [selectedCar, setSelectedCar] = useState('uberx');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isAccountOpen, setIsAccountOpen] = useState(false);
      const [tab, setTab] = useState('coupons');
      const [compDetails, setCompDetails] = useState('');
      const { finalFare } = calculateFare(selectedCar);

      return (
        <div className="flex flex-1 flex-col p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full">
          <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 p-3.5 px-5">
            <div className="text-xs sm:text-sm font-bold text-gray-800 dark:text-neutral-200">
              Special Offer Active: <strong className="text-emerald-700 dark:text-emerald-400">{adminPricing.storeDiscount}% Store Discount</strong> & <strong className="text-emerald-700 dark:text-emerald-400">৳ {adminPricing.bkashCashback} bKash Cashback</strong>!
            </div>
            <button onClick={() => { setTab('coupons'); setIsAccountOpen(true); }} className="text-xs font-black text-emerald-700 underline dark:text-emerald-400">
              View All Coupons →
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[600px] w-full">
            <div className="lg:col-span-5 flex flex-col justify-between rounded-3xl border border-gray-200 bg-white p-5 sm:p-6 shadow-md dark:border-neutral-800 dark:bg-neutral-900">
              <div className="space-y-4">
                <h2 className="text-xl font-black text-gray-900 dark:text-white">Where can we take you?</h2>
                <div className="space-y-2">
                  <div className="flex items-center rounded-xl border border-gray-200 bg-gray-50 px-3 py-2.5 dark:border-neutral-700 dark:bg-neutral-800">
                    <span className="mr-2">●</span>
                    <input type="text" defaultValue="Gulshan 2, Dhaka" className="w-full bg-transparent text-xs font-bold text-gray-900 dark:text-white focus:outline-none" />
                  </div>
                  <div className="flex items-center rounded-xl border border-gray-200 bg-gray-50 px-3 py-2.5 dark:border-neutral-700 dark:bg-neutral-800">
                    <span className="mr-2 text-red-500">■</span>
                    <input type="text" defaultValue="Hazrat Shahjalal Int. Airport" className="w-full bg-transparent text-xs font-bold text-gray-900 dark:text-white focus:outline-none" />
                  </div>
                </div>

                {customer.appliedCoupon && (
                  <div className="flex items-center justify-between rounded-xl border border-dashed border-emerald-500 bg-emerald-50 p-2.5 text-xs dark:bg-emerald-950/40">
                    <div>
                      <strong className="text-emerald-800 dark:text-emerald-300">{customer.appliedCoupon.code} Applied</strong>
                      <span className="block text-[10px] text-emerald-700 dark:text-emerald-400">{customer.appliedCoupon.discount}% Discount (Max ৳ {customer.appliedCoupon.maxCap})</span>
                    </div>
                    <button onClick={removeCoupon} className="font-bold text-red-500">✕</button>
                  </div>
                )}

                <div className="space-y-2 pt-2 max-h-56 overflow-y-auto">
                  {Object.keys(VEHICLE_RATES).map(k => {
                    const v = VEHICLE_RATES[k];
                    const { originalFare, finalFare: fare } = calculateFare(k);
                    const isSel = selectedCar === k;
                    return (
                      <div key={k} onClick={() => setSelectedCar(k)} className={`flex cursor-pointer items-center justify-between rounded-2xl border-2 p-3 ${isSel ? 'border-black bg-gray-50 dark:border-white dark:bg-neutral-800' : 'border-transparent bg-gray-50/50'}`}>
                        <div className="flex items-center gap-3">
                          <span className="text-2xl">{v.icon}</span>
                          <div>
                            <div className="flex items-center gap-2">
                              <h4 className="text-xs font-extrabold">{v.name}</h4>
                              <span className="text-[10px] text-gray-400">{v.capacity}</span>
                            </div>
                            <p className="text-[10px] text-emerald-600 font-bold">{v.eta}</p>
                          </div>
                        </div>
                        <div className="text-right">
                          {originalFare > fare && <span className="block text-[10px] text-gray-400 line-through">৳ {originalFare}</span>}
                          <strong className="text-sm font-black">৳ {fare}</strong>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="mt-4 border-t pt-4 space-y-3">
                <div className="flex justify-between text-xs">
                  <span className="text-gray-500">bKash (৳ {adminPricing.bkashCashback} Cashback) / Uber Cash (৳ {Math.round(customer.walletBalance)})</span>
                  <button onClick={() => { setTab('coupons'); setIsAccountOpen(true); }} className="font-bold underline">🎟️ Coupons</button>
                </div>
                <button onClick={() => setIsModalOpen(true)} className="flex w-full justify-between rounded-2xl bg-black py-4 px-6 text-sm font-extrabold text-white shadow-xl dark:bg-white dark:text-black">
                  <span>Request {VEHICLE_RATES[selectedCar]?.name}</span>
                  <span className="rounded-full bg-white/20 px-3 py-1 text-xs">৳ {finalFare}</span>
                </button>
              </div>
            </div>

            <div className="lg:col-span-7 h-full">
              <LiveMap />
            </div>
          </div>

          {/* Account Modal */}
          {isAccountOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
              <div className="w-full max-w-2xl rounded-3xl bg-white p-6 shadow-2xl dark:bg-neutral-900 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-4">
                  <h3 className="text-lg font-extrabold">👤 {customer.name} Account</h3>
                  <button onClick={() => setIsAccountOpen(false)} className="text-xl font-bold">✕</button>
                </div>
                <div className="flex gap-4 border-b py-3 text-xs font-bold">
                  <button onClick={() => setTab('coupons')} className={`${tab === 'coupons' ? 'text-black underline dark:text-white' : 'text-gray-400'}`}>🎟️ Coupons</button>
                  <button onClick={() => setTab('wallet')} className={`${tab === 'wallet' ? 'text-black underline dark:text-white' : 'text-gray-400'}`}>💰 Uber Cash</button>
                  <button onClick={() => setTab('disputes')} className={`${tab === 'disputes' ? 'text-black underline dark:text-white' : 'text-gray-400'}`}>🎧 Complaints</button>
                </div>
                <div className="py-4">
                  {tab === 'coupons' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {coupons.map((c, i) => (
                        <div key={i} className="border border-dashed p-4 rounded-2xl bg-gray-50 dark:bg-neutral-800">
                          <div className="flex justify-between font-bold">
                            <span className="font-mono bg-black text-white px-2 py-0.5 rounded text-xs">{c.code}</span>
                            <span className="text-emerald-600">{c.discount}% OFF</span>
                          </div>
                          <p className="text-xs mt-2">{c.title} • Max ৳ {c.maxCap}</p>
                          <button onClick={() => { applyCoupon(c); setIsAccountOpen(false); }} className="mt-3 w-full bg-black text-white text-xs font-bold py-1.5 rounded-xl dark:bg-white dark:text-black">Apply to Ride</button>
                        </div>
                      ))}
                    </div>
                  )}
                  {tab === 'wallet' && (
                    <div className="space-y-4">
                      <div className="bg-neutral-900 text-white p-6 rounded-2xl">
                        <span className="text-xs text-gray-400 font-bold uppercase">Balance</span>
                        <div className="text-3xl font-black mt-1">৳ {customer.walletBalance.toFixed(2)}</div>
                      </div>
                      <div className="flex gap-2">
                        {[200, 500, 1000].map(a => (
                          <button key={a} onClick={() => topupWallet(a)} className="border px-4 py-2 rounded-xl text-xs font-bold">+ Top Up ৳ {a}</button>
                        ))}
                      </div>
                    </div>
                  )}
                  {tab === 'disputes' && (
                    <div className="space-y-4">
                      <form onSubmit={(e) => { e.preventDefault(); if (compDetails) { submitComplaint('Driver Overcharged', 'TRIP-8492', compDetails); setCompDetails(''); } }} className="space-y-2">
                        <textarea value={compDetails} onChange={e => setCompDetails(e.target.value)} placeholder="Describe problem with ride..." rows="2" className="w-full border rounded-xl p-3 text-xs dark:bg-neutral-800" required />
                        <button type="submit" className="w-full bg-black text-white text-xs font-bold py-2 rounded-xl">Submit Dispute</button>
                      </form>
                      <div className="space-y-2">
                        {disputes.map(d => (
                          <div key={d.id} className="border p-3 rounded-xl text-xs">
                            <div className="flex justify-between font-bold"><span>{d.id} • {d.category}</span><span className="text-emerald-600">{d.status}</span></div>
                            <p className="text-gray-500 mt-1">"{d.details}"</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Simulation Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
              <div className="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl dark:bg-neutral-900 text-center">
                <div className="py-6 space-y-3">
                  <span className="text-4xl">🚖</span>
                  <h3 className="text-lg font-black">Driver Matched!</h3>
                  <p className="text-xs text-gray-500">Mohammad Rafiq (Silver Toyota Corolla • DHA-GA-11-8492) is arriving in 3 mins.</p>
                  <div className="bg-gray-50 p-3 rounded-xl text-xs font-bold dark:bg-neutral-800">Total Fare: ৳ {finalFare}</div>
                  <button onClick={() => setIsModalOpen(false)} className="w-full bg-black text-white text-xs font-bold py-3 rounded-xl dark:bg-white dark:text-black">Complete Ride</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- DRIVER PORTAL ---
    const DriverPortal = () => {
      const { driver, toggleDriverOnline, acceptDriverTrip } = useApp();
      return (
        <div className="flex flex-1 flex-col p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full">
          <div className="flex flex-wrap items-center justify-between gap-4 rounded-3xl border border-gray-200 bg-white p-6 shadow-sm dark:border-neutral-800 dark:bg-neutral-900">
            <div className="flex items-center gap-4">
              <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600 text-2xl text-white">👨‍✈️</div>
              <div>
                <h2 className="text-xl font-black">{driver.name} (★ 4.95)</h2>
                <p className="text-xs text-gray-500">{driver.car}</p>
              </div>
            </div>
            <button onClick={toggleDriverOnline} className={`rounded-2xl px-6 py-3 text-xs font-black text-white ${driver.isOnline ? 'bg-neutral-800' : 'bg-emerald-600'}`}>
              {driver.isOnline ? 'Go Offline' : 'Go Online'}
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="rounded-3xl border border-gray-200 bg-white p-6 shadow-md dark:border-neutral-800 dark:bg-neutral-900">
              <h3 className="text-base font-extrabold mb-4">Live Ride Radar</h3>
              {driver.isOnline ? (
                <div className="border-2 border-emerald-500 bg-emerald-50/50 p-4 rounded-2xl dark:bg-neutral-800">
                  <div className="flex justify-between font-bold">
                    <span>👤 Nazmus Sakib</span>
                    <span className="text-emerald-600 text-base">৳ 342.00</span>
                  </div>
                  <p className="text-xs text-gray-500 mt-2">Route: Gulshan 2 ➔ Hazrat Shahjalal Airport</p>
                  <button onClick={() => acceptDriverTrip(342)} className="mt-4 w-full bg-emerald-600 text-white text-xs font-black py-2.5 rounded-xl">Accept Trip (৳ 342)</button>
                </div>
              ) : (
                <p className="text-xs text-gray-400 py-8 text-center">You are currently offline</p>
              )}
            </div>

            <div className="rounded-3xl border border-gray-200 bg-gradient-to-br from-emerald-600 to-emerald-800 p-6 text-white shadow-lg">
              <span className="text-xs font-bold uppercase text-emerald-200">Today's Earnings</span>
              <div className="text-4xl font-black mt-1">৳ {driver.todayEarnings.toFixed(2)}</div>
              <p className="text-xs text-emerald-100 mt-3">{driver.tripsCompleted} Completed Trips Today (+৳ 500 Quest Bonus at 15 trips)</p>
            </div>
          </div>
        </div>
      );
    };

    // --- ADMIN PORTAL ---
    const AdminPortal = () => {
      const { adminPricing, updateAdminPricing, coupons, addCoupon, deleteCoupon, disputes, resolveDispute } = useApp();
      const [form, setForm] = useState({ ...adminPricing });
      const [newCode, setNewCode] = useState('');
      const [newDisc, setNewDisc] = useState('');
      const [refunds, setRefunds] = useState({});

      const handleFormChange = (f, v) => {
        const val = f === 'couponCode' ? v.toUpperCase() : (parseFloat(v) || 0);
        const up = { ...form, [f]: val };
        setForm(up);
        updateAdminPricing(up);
      };

      return (
        <div className="flex flex-1 flex-col p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="border p-4 rounded-2xl bg-white shadow-sm dark:bg-neutral-900 dark:border-neutral-800">
              <span className="text-[11px] font-bold text-gray-400 uppercase">Gross Bookings</span>
              <div className="text-lg font-black">৳ 1,48,250</div>
            </div>
            <div className="border p-4 rounded-2xl bg-white shadow-sm dark:bg-neutral-900 dark:border-neutral-800">
              <span className="text-[11px] font-bold text-gray-400 uppercase">Active Fleet</span>
              <div className="text-lg font-black">342 Online</div>
            </div>
            <div className="border p-4 rounded-2xl bg-white shadow-sm dark:bg-neutral-900 dark:border-neutral-800">
              <span className="text-[11px] font-bold text-gray-400 uppercase">Active Campaign</span>
              <div className="text-sm font-black">{adminPricing.couponCode} ({adminPricing.storeDiscount}% OFF)</div>
            </div>
            <div className="border p-4 rounded-2xl bg-white shadow-sm dark:bg-neutral-900 dark:border-neutral-800">
              <span className="text-[11px] font-bold text-gray-400 uppercase">Disputes</span>
              <div className="text-lg font-black text-amber-600">{disputes.filter(d => d.status === 'PENDING').length} Pending</div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            {/* Control Panel Card */}
            <div className="lg:col-span-4 rounded-3xl border-2 border-emerald-500 bg-white p-6 shadow-xl dark:bg-neutral-900">
              <h2 className="text-lg font-black text-emerald-700 dark:text-emerald-400">Your Pricing Inputs</h2>
              <h3 className="text-sm font-extrabold text-gray-900 dark:text-white">(Company Control Panel)</h3>
              <p className="text-xs text-gray-500 mt-1 mb-4">Adjust your offer parameters</p>

              <form onSubmit={(e) => { e.preventDefault(); updateAdminPricing(form); }} className="space-y-3">
                <div>
                  <label className="text-xs font-bold text-gray-700 dark:text-neutral-300">Store Discount</label>
                  <input type="number" value={form.storeDiscount} onChange={e => handleFormChange('storeDiscount', e.target.value)} className="w-full border rounded-xl p-2 text-xs font-bold dark:bg-neutral-800" />
                  <span className="text-[10px] text-gray-400">Current: {form.storeDiscount}% off</span>
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-700 dark:text-neutral-300">Coupon Code</label>
                  <input type="text" value={form.couponCode} onChange={e => handleFormChange('couponCode', e.target.value)} className="w-full uppercase border rounded-xl p-2 text-xs font-bold dark:bg-neutral-800" />
                  <span className="text-[10px] text-gray-400">Current: {form.couponCode}</span>
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-700 dark:text-neutral-300">bKash Cashback</label>
                  <input type="number" value={form.bkashCashback} onChange={e => handleFormChange('bkashCashback', e.target.value)} className="w-full border rounded-xl p-2 text-xs font-bold dark:bg-neutral-800" />
                  <span className="text-[10px] text-gray-400">Current: ৳ {form.bkashCashback}</span>
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-700 dark:text-neutral-300">Shipping Cost / Surge</label>
                  <input type="number" value={form.shippingCost} onChange={e => handleFormChange('shippingCost', e.target.value)} className="w-full border rounded-xl p-2 text-xs font-bold dark:bg-neutral-800" />
                  <span className="text-[10px] text-gray-400">Current: ৳ {form.shippingCost} Surge</span>
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-700 dark:text-neutral-300">Sale Price (Optional)</label>
                  <input type="number" value={form.salePrice} onChange={e => handleFormChange('salePrice', e.target.value)} className="w-full border rounded-xl p-2 text-xs font-bold dark:bg-neutral-800" />
                  <span className="text-[10px] text-gray-400">Current: ৳ {form.salePrice.toLocaleString()}</span>
                </div>
                <button type="submit" className="w-full bg-emerald-600 text-white text-xs font-bold py-3 rounded-xl shadow-lg">
                  🔄 Apply Changes
                </button>
              </form>
            </div>

            {/* Coupons Table */}
            <div className="lg:col-span-4 rounded-3xl border bg-white p-6 shadow-md dark:bg-neutral-900 dark:border-neutral-800">
              <h3 className="text-base font-extrabold mb-1">🎟️ Coupon & Promo Manager</h3>
              <p className="text-xs text-gray-500 mb-4">Create and publish promo codes</p>

              <form onSubmit={(e) => { e.preventDefault(); if (newCode && newDisc) { addCoupon(newCode, newDisc, 150); setNewCode(''); setNewDisc(''); } }} className="flex gap-2 mb-4 bg-gray-50 p-2 rounded-xl dark:bg-neutral-800">
                <input type="text" value={newCode} onChange={e => setNewCode(e.target.value)} placeholder="CODE" className="w-24 border rounded p-1 text-xs uppercase font-bold dark:bg-neutral-900" />
                <input type="number" value={newDisc} onChange={e => setNewDisc(e.target.value)} placeholder="Dis %" className="w-16 border rounded p-1 text-xs font-bold dark:bg-neutral-900" />
                <button type="submit" className="bg-black text-white text-xs font-bold px-3 py-1 rounded dark:bg-white dark:text-black">+ Publish</button>
              </form>

              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b text-gray-400 text-[10px] uppercase font-bold">
                    <th className="pb-1">Code</th>
                    <th className="pb-1">Discount</th>
                    <th className="pb-1">Max Cap</th>
                    <th className="pb-1 text-right">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y dark:divide-neutral-800">
                  {coupons.map((c, idx) => (
                    <tr key={idx}>
                      <td className="py-2 font-mono font-bold">{c.code}</td>
                      <td className="py-2 text-emerald-600 font-bold">{c.discount}% OFF</td>
                      <td className="py-2 font-semibold">৳ {c.maxCap}</td>
                      <td className="py-2 text-right"><button onClick={() => deleteCoupon(idx)} className="text-red-500 font-bold">Delete</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Disputes Inbox */}
            <div className="lg:col-span-4 rounded-3xl border bg-white p-6 shadow-md dark:bg-neutral-900 dark:border-neutral-800">
              <h3 className="text-base font-extrabold mb-1">🎧 Disputes & Refunds</h3>
              <p className="text-xs text-gray-500 mb-4">Review complaints and credit rider wallets</p>
              <div className="space-y-3">
                {disputes.map(d => (
                  <div key={d.id} className="border p-3 rounded-2xl text-xs space-y-2 dark:border-neutral-800">
                    <div className="flex justify-between font-bold"><span>👤 {d.userName}</span><span className="text-emerald-600">{d.status}</span></div>
                    <div className="text-gray-600 dark:text-neutral-300 font-semibold">{d.category} • {d.tripId}</div>
                    <p className="italic bg-gray-50 p-2 rounded dark:bg-neutral-800">"{d.details}"</p>
                    {d.status === 'PENDING' ? (
                      <div className="space-y-1.5 pt-1">
                        <div className="flex items-center gap-2">
                          <label className="text-[11px] font-bold">Credit Refund (৳):</label>
                          <input type="number" defaultValue={d.refundAmount} onChange={e => setRefunds({ ...refunds, [d.id]: e.target.value })} className="w-20 border rounded p-1 text-xs font-bold dark:bg-neutral-800" />
                        </div>
                        <button onClick={() => resolveDispute(d.id, refunds[d.id] || d.refundAmount)} className="w-full bg-emerald-600 text-white text-xs font-bold py-2 rounded-xl">
                          ✅ Resolve & Credit Refund
                        </button>
                      </div>
                    ) : (
                      <div className="text-emerald-600 font-bold">✓ Refunded ৳ {d.refundAmount} to wallet</div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN APP ---
    const App = () => {
      const { currentScreen, toasts } = useApp();
      return (
        <div className="flex min-h-screen flex-col bg-gray-50 text-gray-900 dark:bg-neutral-950 dark:text-neutral-100">
          {currentScreen === 'auth' ? <AuthGate /> : (
            <>
              <Navbar />
              <main className="flex flex-1 flex-col">
                {currentScreen === 'customer' && <CustomerPortal />}
                {currentScreen === 'driver' && <DriverPortal />}
                {currentScreen === 'admin' && <AdminPortal />}
              </main>
            </>
          )}

          {/* Toast Container */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="pointer-events-auto rounded-xl bg-neutral-900 px-4 py-2.5 text-xs font-bold text-white shadow-xl dark:bg-white dark:text-black">
                {t.message}
              </div>
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
