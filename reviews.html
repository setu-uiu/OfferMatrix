<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Reviews & Ratings - OfferMatrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <script src="js/om-store.js"></script>
  <script src="js/om-profile.js"></script>
  <style>
    :root {
      --pink: #ff1a6e;
      --pink-light: #fff0f5;
      --pink-mid: #ffe4ec;
      --dark: #111827;
      --mid: #4b5563;
      --light: #9ca3af;
      --bg: #f8fafc;
      --border: #f1f5f9;
      --green: #10b981;
      --green-bg: #dcfce7;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
    }

    body {
      background: var(--bg);
      color: var(--dark);
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR STYLES */
    .sb {
      width: 240px;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.2rem 0;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .sb::-webkit-scrollbar {
      display: none;
    }

    .sb-logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: 0 1.4rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .sb-logo-icon {
      width: 34px;
      height: 34px;
      background: var(--pink);
      border-radius: 10px;
      color: #fff;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .sb-logo-text {
      font-size: 1.3rem;
      font-weight: 800;
      color: #111827;
    }

    .sb-nav {
      flex: 1;
      padding: .8rem 0;
    }

    .sb-group {
      font-size: .7rem;
      font-weight: 700;
      color: var(--light);
      letter-spacing: 1px;
      padding: 1rem 1.4rem .4rem;
      text-transform: uppercase;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .7rem 1.4rem;
      font-size: .9rem;
      font-weight: 600;
      color: var(--mid);
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      border: none;
      background: transparent;
      text-decoration: none;
    }

    .sb-item:hover {
      color: var(--pink);
    }

    .sb-item.on {
      background: var(--pink);
      color: #fff;
      border-radius: 10px;
      margin: 0 .8rem;
      padding: .7rem .6rem;
      width: calc(100% - 1.6rem);
      font-weight: 800;
    }

    .sb-item.on .sb-ico {
      color: #fff;
    }

    .sb-ico {
      font-size: 1.1rem;
      width: 22px;
      text-align: center;
      color: #6b7280;
      transition: all .2s;
      flex-shrink: 0;
    }

    .sb-badge {
      margin-left: auto;
      font-size: .65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 50px;
      background: var(--pink);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sb-badge.red {
      background: #fff;
      color: #ef4444;
      border: 1.5px solid #ef4444;
    }

    .sb-red {
      color: #ef4444 !important;
    }

    /* MAIN AREA */
    .main {
      margin-left: 240px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 65px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .tb-search {
      display: flex;
      align-items: center;
      gap: .6rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: .45rem 1rem;
      width: 340px;
    }

    .tb-search input {
      border: none;
      background: transparent;
      outline: none;
      font-size: .82rem;
      width: 100%;
    }

    .tb-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .tb-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      color: var(--mid);
    }

    .notif-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--pink);
      border: 2px solid #fff;
    }

    .tb-saved {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .85rem;
      font-weight: 600;
      color: var(--mid);
      padding: .5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 50px;
      cursor: pointer;
    }

    .tb-user {
      display: flex;
      align-items: center;
      gap: .6rem;
      cursor: pointer;
    }

    .tb-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .tb-uname {
      font-size: .82rem;
      font-weight: 800;
      color: #111827;
    }

    .tb-umeta {
      font-size: .68rem;
      color: var(--light);
    }

    /* CONTENT AREA */
    .pg {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .rev-hdr-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .rev-title {
      font-size: 1.7rem;
      font-weight: 900;
      color: #111827;
      letter-spacing: -.4px;
      margin-bottom: 3px;
    }

    .rev-sub {
      font-size: .82rem;
      color: var(--light);
    }

    /* FILTER TABS */
    .rev-tabs-bar {
      display: flex;
      gap: .6rem;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .rev-tab-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: .65rem 1.3rem;
      border: 1px solid var(--border);
      border-radius: 50px;
      background: #fff;
      font-size: .82rem;
      font-weight: 700;
      color: var(--mid);
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }

    .rev-tab-pill:hover {
      border-color: var(--pink);
      color: var(--pink);
    }

    .rev-tab-pill.active {
      background: var(--pink);
      color: #fff;
      border-color: var(--pink);
    }

    .rev-tab-badge {
      font-size: .65rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 50px;
      background: rgba(0, 0, 0, .08);
    }

    .rev-tab-pill.active .rev-tab-badge {
      background: #fff;
      color: var(--pink);
    }

    /* REVIEWS LIST */
    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .review-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: all .2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .review-card:hover {
      border-color: #fecdd3;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
    }

    .rc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .rc-user-box {
      display: flex;
      align-items: center;
      gap: .8rem;
    }

    .rc-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    .rc-uname {
      font-size: .9rem;
      font-weight: 800;
      color: #111827;
    }

    .rc-meta {
      font-size: .7rem;
      color: var(--light);
    }

    .rc-sentiment-badge {
      font-size: .68rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sentiment-best {
      background: var(--green-bg);
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .sentiment-worst {
      background: var(--red-bg);
      color: #991b1b;
      border: 1px solid #fecdd3;
    }

    .rc-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: #111827;
      margin-bottom: 4px;
    }

    .rc-target {
      font-size: .78rem;
      font-weight: 700;
      color: var(--pink);
      margin-bottom: .5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rc-stars {
      color: #f59e0b;
      font-size: .85rem;
      font-weight: 800;
    }

    .rc-text {
      font-size: .88rem;
      color: #374151;
      line-height: 1.5;
    }

    .rc-pills-row {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      margin-top: .4rem;
    }

    .pro-pill {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .con-pill {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecdd3;
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .rc-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f3f4f6;
      padding-top: .9rem;
    }

    .btn-upvote {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: .4rem 1rem;
      font-size: .75rem;
      font-weight: 800;
      color: var(--mid);
      cursor: pointer;
      transition: all .2s;
    }

    .btn-upvote:hover {
      border-color: var(--pink);
      color: var(--pink);
      background: #fff;
    }

    .btn-toggle-replies {
      font-size: .78rem;
      font-weight: 800;
      color: var(--pink);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* REPLIES SECTION */
    .replies-box {
      background: #fafafa;
      border: 1px solid #f1f5f9;
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
      margin-top: .4rem;
    }

    .reply-item {
      background: #fff;
      border: 1px solid #f1f5f9;
      border-radius: 10px;
      padding: .7rem 1rem;
    }

    .reply-hdr {
      display: flex;
      justify-content: space-between;
      font-size: .72rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 3px;
    }

    .reply-text {
      font-size: .8rem;
      color: var(--mid);
    }

    .reply-form-row {
      display: flex;
      gap: .6rem;
      margin-top: .4rem;
    }

    .reply-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: .5rem 1rem;
      font-size: .8rem;
      outline: none;
    }

    .btn-post-reply {
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: .5rem 1.2rem;
      font-size: .75rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-write-rev {
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: .75rem 1.6rem;
      font-size: .85rem;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s;
      box-shadow: 0 4px 12px rgba(255, 26, 110, 0.2);
    }

    .btn-write-rev:hover {
      opacity: .9;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sb">
    <div class="sb-logo">
      <div class="sb-logo-icon">%</div>
      <span class="sb-logo-text">Offer<span style="color:#22c55e">Matrix</span></span>
    </div>
    <nav class="sb-nav">
      <div class="sb-group">MAIN</div>
      <button class="sb-item" onclick="window.location.href='dashboard.html'"><span class="sb-ico">&#127968;</span>
        Dashboard</button>
      <button class="sb-item" onclick="window.location.href='dashboard.html?tab=food'"><span
          class="sb-ico">&#127860;</span> Food</button>
      <button class="sb-item" onclick="window.location.href='dashboard.html?tab=ride'"><span class="sb-ico"
          style="color:inherit;">&#128663;</span> Ride</button>
      <button class="sb-item" onclick="window.location.href='skincare.html'"><span class="sb-ico">&#128167;</span>
        Skincare</button>
      <button class="sb-item" onclick="window.location.href='orders.html'"><span class="sb-ico">&#128230;</span> Orders
        <span class="sb-badge" id="sb-badge-orders">6</span></button>
      <button class="sb-item" onclick="window.location.href='saved-deals.html'"><span class="sb-ico">&#10084;</span>
        Saved Deals</button>
      <button class="sb-item" onclick="window.location.href='price-alerts.html'"><span class="sb-ico">&#128276;</span>
        Price Alerts <span class="sb-badge" id="sb-badge-alerts">5</span></button>
      <button class="sb-item" onclick="window.location.href='coupons.html'"><span class="sb-ico">&#127915;</span>
        Coupons</button>
      <button class="sb-item on"><span class="sb-ico">&#11088;</span> Reviews</button>

      <div class="sb-group">COMMUNITY</div>
      <button class="sb-item sb-red" onclick="window.location.href='complaints.html'"><span
          class="sb-ico">&#128680;</span> Complain Issues <span class="sb-badge red">Alert</span></button>
      <button class="sb-item" onclick="window.OMWallet && window.OMWallet.open()"><span class="sb-ico">&#128179;</span>
        My Wallet</button>
      <button class="sb-item" onclick="window.OMBankCards && window.OMBankCards.open()"><span
          class="sb-ico">&#128179;</span> Bank Cards</button>
      <button class="sb-item" onclick="window.OMReferral && window.OMReferral.open()"><span
          class="sb-ico">&#127873;</span> Refer &amp; Earn</button>

      <div class="sb-group">ACCOUNT</div>
      <button class="sb-item"><span class="sb-ico">&#9881;</span> Settings</button>
      <button class="sb-item"><span class="sb-ico">&#10067;</span> Help &amp; Support</button>
      <button class="sb-item sb-red" onclick="window.location.href='index.html'"><span class="sb-ico">&#128682;</span>
        Log Out</button>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="tb-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.5">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" placeholder="Search reviews, food, ride apps, skincare..." />
      </div>
      <div class="tb-actions">
        <button class="tb-icon-btn" onclick="alert('Notification: Review reply received!')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <div class="notif-dot"></div>
        </button>
        <div class="tb-saved" onclick="window.location.href='saved-deals.html'"><svg width="16" height="16"
            viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
          </svg> Saved</div>
        <div class="tb-user">
          <img class="tb-avatar"
            src="https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&w=100"
            alt="User" />
          <div>
            <div class="tb-uname">Setu Meherunnesa</div>
            <div class="tb-umeta">Premium Member</div>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTAINER -->
    <div class="pg">

      <!-- HEADER ROW -->
      <div class="rev-hdr-row">
        <div>
          <div class="rev-title">Community Reviews &amp; Ratings &#11088;</div>
          <div class="rev-sub">Honest feedback on which apps, food items &amp; products are BEST or WORST!</div>
        </div>

        <button class="btn-write-rev" onclick="openWriteModal()">+ Write a Review</button>
      </div>

      <!-- FILTER TABS BAR -->
      <div class="rev-tabs-bar">
        <button class="rev-tab-pill active" id="tab-all" onclick="filterReviews('all')">&#127915; All Reviews <span
            class="rev-tab-badge" id="badge-all">5</span></button>
        <button class="rev-tab-pill" id="tab-best" onclick="filterReviews('best')">&#128994; Top Rated (Best) <span
            class="rev-tab-badge" id="badge-best">3</span></button>
        <button class="rev-tab-pill" id="tab-worst" onclick="filterReviews('worst')">&#128308; Worst &amp; Warnings
          <span class="rev-tab-badge" id="badge-worst">2</span></button>
        <button class="rev-tab-pill" id="tab-food" onclick="filterReviews('food')">&#127860; Food Reviews <span
            class="rev-tab-badge" id="badge-food">2</span></button>
        <button class="rev-tab-pill" id="tab-ride" onclick="filterReviews('ride')">&#128663; Ride App Reviews <span
            class="rev-tab-badge" id="badge-ride">2</span></button>
        <button class="rev-tab-pill" id="tab-skincare" onclick="filterReviews('skincare')">&#128167; Skincare Reviews
          <span class="rev-tab-badge" id="badge-skincare">1</span></button>
      </div>

      <!-- REVIEWS LIST -->
      <div class="reviews-list" id="reviews-container">
        <!-- Dynamically rendered -->
      </div>

    </div>

  </div>

  <!-- WRITE REVIEW MODAL -->
  <div id="modal-review"
    style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;">
    <div
      style="background:#fff;border-radius:20px;padding:1.8rem;width:90%;max-width:480px;box-shadow:0 10px 30px rgba(0,0,0,0.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;">
        <h3 style="font-size:1.1rem;font-weight:800;color:#111827">Share Your Review</h3>
        <button onclick="closeWriteModal()"
          style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:#9ca3af">&times;</button>
      </div>
      <form id="form-write-review" onsubmit="submitNewReview(event)">
        <div style="margin-bottom:1rem">
          <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">App or Product Name</label>
          <input id="rev-input-item" type="text" required placeholder="e.g. Sultan Kacchi / Uber Ride / CeraVe Cleanser"
            style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem" />
        </div>
        <div style="display:flex;gap:1rem;margin-bottom:1rem">
          <div style="flex:1">
            <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Category</label>
            <select id="rev-input-cat"
              style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem">
              <option value="food">Food</option>
              <option value="ride">Ride</option>
              <option value="skincare">Skincare</option>
            </select>
          </div>
          <div style="flex:1">
            <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Rating (1 to 5
              Stars)</label>
            <select id="rev-input-rating"
              style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem">
              <option value="5.0">5.0 ★★★★★ (Best)</option>
              <option value="4.0">4.0 ★★★★☆ (Good)</option>
              <option value="3.0">3.0 ★☆☆☆☆ (Average)</option>
              <option value="2.0">2.0 ★★☆☆☆ (Poor)</option>
              <option value="1.0">1.0 ★☆☆☆☆ (Worst)</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:1rem">
          <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Review Headline Title</label>
          <input id="rev-input-title" type="text" required placeholder="e.g. Incredible Taste & Fast Delivery!"
            style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem" />
        </div>
        <div style="margin-bottom:1rem">
          <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Review Details</label>
          <textarea id="rev-input-text" required rows="3" placeholder="Share your experience..."
            style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem;resize:none"></textarea>
        </div>
        <div style="display:flex;gap:1rem;margin-bottom:1.4rem">
          <div style="flex:1">
            <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Pros (comma
              separated)</label>
            <input id="rev-input-pros" type="text" placeholder="e.g. Fast, Tender Meat"
              style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem" />
          </div>
          <div style="flex:1">
            <label style="font-size:.78rem;font-weight:700;display:block;margin-bottom:4px">Cons (comma
              separated)</label>
            <input id="rev-input-cons" type="text" placeholder="e.g. Late delivery"
              style="width:100%;padding:.6rem 1rem;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:.85rem" />
          </div>
        </div>
        <button type="submit" class="btn-write-rev"
          style="width:100%;padding:.75rem;font-size:.9rem;border-radius:50px">Post Community Review</button>
      </form>
    </div>
  </div>

  <script>
    let currentReviewFilter = 'all';

    function renderReviews(filter) {
      currentReviewFilter = filter || currentReviewFilter || 'all';
      const container = document.getElementById('reviews-container');
      if (!container || !window.OMStore) return;

      const reviews = window.OMStore.getReviews(currentReviewFilter);
      const allReviews = window.OMStore.getReviews('all');

      // Update active tab buttons
      document.querySelectorAll('.rev-tab-pill').forEach(btn => btn.classList.remove('active'));
      const activeTab = document.getElementById('tab-' + currentReviewFilter);
      if (activeTab) activeTab.classList.add('active');

      // Update tab badges
      document.getElementById('badge-all').textContent = allReviews.length;
      document.getElementById('badge-best').textContent = window.OMStore.getReviews('best').length;
      document.getElementById('badge-worst').textContent = window.OMStore.getReviews('worst').length;
      document.getElementById('badge-food').textContent = window.OMStore.getReviews('food').length;
      document.getElementById('badge-ride').textContent = window.OMStore.getReviews('ride').length;
      document.getElementById('badge-skincare').textContent = window.OMStore.getReviews('skincare').length;

      if (reviews.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--light);">No community reviews in this section yet. Be the first to share one!</div>';
        return;
      }

      container.innerHTML = reviews.map(r => `
      <div class="review-card" id="rev-card-${r.id}">
        <div class="rc-header">
          <div class="rc-user-box">
            <img class="rc-avatar" src="${r.userAvatar || 'https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&w=100'}" alt="User"/>
            <div>
              <div class="rc-uname">${r.userName}</div>
              <div class="rc-meta">Posted ${r.date}</div>
            </div>
          </div>

          <span class="rc-sentiment-badge ${r.sentiment === 'best' ? 'sentiment-best' : 'sentiment-worst'}">
            ${r.sentiment === 'best' ? '🟢 BEST RECOMMENDATION' : '🔴 WORST EXPERIENCE / WARNING'}
          </span>
        </div>

        <div>
          <div class="rc-target">
            <span>${r.itemTitle}</span>
            <span style="color:var(--light)">&bull;</span>
            <span style="color:var(--mid)">App: <b>${r.appName}</b></span>
            <span class="rc-stars">&#9733; ${r.rating.toFixed(1)}</span>
          </div>
          <div class="rc-title">${r.title}</div>
          <div class="rc-text">${r.reviewText}</div>

          <div class="rc-pills-row">
            ${(r.pros || []).map(p => `<span class="pro-pill"><span>&#10003;</span> ${p}</span>`).join('')}
            ${(r.cons || []).map(c => `<span class="con-pill"><span>&times;</span> ${c}</span>`).join('')}
          </div>
        </div>

        <div class="rc-actions-bar">
          <button class="btn-upvote" onclick="handleUpvote('${r.id}')">
            <span>&#128077;</span> Helpful (${r.upvotes || 0})
          </button>
          
          <button class="btn-toggle-replies" onclick="toggleRepliesSection('${r.id}')">
            <span>&#128172;</span> Replies (${(r.replies || []).length})
          </button>
        </div>

        <!-- REPLIES CONTAINER -->
        <div class="replies-box" id="replies-box-${r.id}" style="display:none">
          <div id="replies-list-${r.id}">
            ${(r.replies || []).length === 0 ? '<div style="font-size:.75rem;color:var(--light);">No replies yet. Start the conversation!</div>' :
          (r.replies || []).map(rep => `
                <div class="reply-item">
                  <div class="reply-hdr">
                    <span>${rep.userName}</span>
                    <span style="color:var(--light)">${rep.date}</span>
                  </div>
                  <div class="reply-text">${rep.text}</div>
                </div>
              `).join('')}
          </div>

          <div class="reply-form-row">
            <input type="text" class="reply-input" id="reply-input-${r.id}" placeholder="Write a reply..."/>
            <button class="btn-post-reply" onclick="handlePostReply('${r.id}')">Post Reply</button>
          </div>
        </div>
      </div>
    `).join('');
    }

    function filterReviews(filter) {
      renderReviews(filter);
    }

    function handleUpvote(id) {
      if (window.OMStore) {
        window.OMStore.upvoteReview(id);
        renderReviews();
      }
    }

    function toggleRepliesSection(id) {
      const box = document.getElementById('replies-box-' + id);
      if (box) {
        box.style.display = box.style.display === 'none' ? 'flex' : 'none';
      }
    }

    function handlePostReply(id) {
      const input = document.getElementById('reply-input-' + id);
      if (!input || !input.value.trim()) return;

      if (window.OMStore) {
        window.OMStore.addReply(id, input.value.trim());
        renderReviews();
        const box = document.getElementById('replies-box-' + id);
        if (box) box.style.display = 'flex';
      }
    }

    function openWriteModal() {
      document.getElementById('modal-review').style.display = 'flex';
    }

    function closeWriteModal() {
      document.getElementById('modal-review').style.display = 'none';
    }

    function submitNewReview(e) {
      e.preventDefault();
      const itemTitle = document.getElementById('rev-input-item').value;
      const category = document.getElementById('rev-input-cat').value;
      const rating = Number(document.getElementById('rev-input-rating').value);
      const title = document.getElementById('rev-input-title').value;
      const reviewText = document.getElementById('rev-input-text').value;
      const pros = document.getElementById('rev-input-pros').value;
      const cons = document.getElementById('rev-input-cons').value;

      if (window.OMStore) {
        window.OMStore.addReview({
          itemTitle,
          category,
          appName: category === 'food' ? 'foodpanda / foodi' : (category === 'ride' ? 'Uber / Pathao' : 'Beautybooth'),
          rating,
          title,
          reviewText,
          pros,
          cons
        });
        closeWriteModal();
        document.getElementById('form-write-review').reset();
        renderReviews();
      }
    }

    window.addEventListener('DOMContentLoaded', function () {
      var params = new URLSearchParams(window.location.search);
      var catParam = params.get('cat');
      if (catParam === 'food') {
        document.body.classList.add('food-sky-theme');
        renderReviews('food');
      } else {
        renderReviews(catParam && ['food', 'ride', 'skincare', 'best', 'worst'].includes(catParam) ? catParam : 'all');
      }
    });
  </script>

</body>

</html>
