    // Real distance formula for Dhaka city road network (~1.32x detour factor)
    function calculateRouteDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const straightKm = R * c;
      const roadKm = straightKm * 1.32;
      const finalKm = Math.max(1.5, Math.round(roadKm * 10) / 10);
      const estMins = Math.max(6, Math.round(finalKm * 2.4 + 4));
      return { distanceKm: finalKm, durationMins: estMins };
    }

      const resolveDispute = (ticketId, customRefund) => {
        const refund = parseFloat(customRefund) || 0;
        setDisputes(prev => prev.map(d => (d.id === ticketId ? { ...d, status: 'RESOLVED', refundAmount: refund } : d)));
        
        setCustomer(prev => {
          const newBal = prev.walletBalance + refund;
          localStorage.setItem('obhai_react_wallet', newBal);
          return { ...prev, walletBalance: newBal };
        });

        showToast(`✅ অভিযোগ সমাধান হয়েছে! ৳ ${refund} যাত্রীর ওয়ালেটে যুক্ত হয়েছে।`);
      };

      const toggleDriverOnline = () => {
        setDriver(prev => {
          const nextOnline = !prev.isOnline;
          showToast(nextOnline ? 'আপনি এখন অনলাইন আছেন' : 'আপনি অফলাইনে গেছেন');
          return { ...prev, isOnline: nextOnline };
        });
      };

      const acceptDriverTrip = (fare = 194.00) => {
        setDriver(prev => {
          const newEarnings = prev.todayEarnings + fare;
          const newTrips = prev.tripsCompleted + 1;
          localStorage.setItem('obhai_react_captain_earnings', newEarnings);
          localStorage.setItem('obhai_react_captain_trips', newTrips);
          return { ...prev, todayEarnings: newEarnings, tripsCompleted: newTrips };
        });
        showToast('ট্রিপ গ্রহণ করা হয়েছে! যাত্রীর অবস্থানের দিকে রওনা হন...');
      };

      const updateRoutePoints = (newPickup, newDest) => {
        const p = newPickup || route.pickup;
        const d = newDest || route.dest;
        const { distanceKm, durationMins } = calculateRouteDistance(p.lat, p.lng, d.lat, d.lng);
        setRoute(prev => ({
          ...prev,
          pickup: p,
          dest: d,
          distanceKm,
          durationMins,
        }));
      };

      const calculateFare = (carKey, customDistanceKm = null) => {
        const rate = VEHICLE_RATES[carKey] || VEHICLE_RATES.cng;
        const dist = customDistanceKm !== null ? customDistanceKm : route.distanceKm;
        const p = adminPricing;
        
        const baseFare = rate.base;
        const distanceFare = Math.round(dist * rate.perKm);
        const originalFare = Math.round(baseFare + distanceFare + p.shippingCost);
        let discountAmt = Math.round(originalFare * (p.storeDiscount / 100));
        let finalFare = Math.max(30, originalFare - discountAmt);

        if (customer.appliedCoupon) {
          const c = customer.appliedCoupon;
          const extraDisc = Math.min(c.maxCap, Math.round(finalFare * (c.discount / 100)));
          discountAmt += extraDisc;
          finalFare = Math.max(25, finalFare - extraDisc);
        }

        return { originalFare, finalFare, baseFare, distanceFare, discountAmt, ratePerKm: rate.perKm };
      };

      return (
        <AppContext.Provider
          value={{
            theme,
            toggleTheme,
            currentScreen,
            selectedAuthRole,
            setSelectedAuthRole,
            enterPortal,
            logOutToGate,
            adminPricing,
            updateAdminPricing,
            coupons,
            addCoupon,
            deleteCoupon,
            customer,
            applyCoupon,
            removeCoupon,
            topupWallet,
            submitComplaint,
            driver,
            toggleDriverOnline,
            acceptDriverTrip,
            disputes,
            resolveDispute,
            route,
            setRoute,
            updateRoutePoints,
            calculateFare,
            toasts,
            showToast,
          }}
        >
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // --- LOCATION SEARCH COMPONENT ---
    const LocationSearchInput = ({ placeholder, selectedLocation, onSelectLocation, isPickup, referenceLocation }) => {

          if (containerRef.current && !containerRef.current.contains(e.target)) {

          }

        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);

      const filtered = DHAKA_LOCATIONS.filter(loc => {
        const q = query.toLowerCase().trim();
        if (!q) return true;
        return (
          loc.name.toLowerCase().includes(q) ||

          loc.area.toLowerCase().includes(q) ||
          loc.landmark.toLowerCase().includes(q)

                : 'border-emerald-100 hover:border-emerald-300 dark:border-neutral-700 dark:bg-neutral-800/80'
            }`}

            <div className="mr-2.5 flex h-4 w-4 items-center justify-center flex-shrink-0">

                <span className="h-2.5 w-2.5 rounded bg-rose-500 ring-2 ring-rose-200" />
              )}
            </div>

            <input
              type="text"
              value={query}
              onChange={(e) => {
                setQuery(e.target.value);
                setIsOpen(true);
              }}
              onFocus={() => setIsOpen(true)}
              placeholder={placeholder}
              className="w-full bg-transparent text-xs font-extrabold text-gray-900 focus:outline-none dark:text-white placeholder:text-gray-400"
            />

            {query && (
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  setQuery('');
                  setIsOpen(true);
                }}
                className="rounded-full p-1 text-gray-400 hover:bg-gray-200 hover:text-gray-700 dark:hover:bg-neutral-700 mr-1"
              >
                ✕
              </button>
            )}
            <span className="text-emerald-700 dark:text-emerald-400 text-xs">🔍</span>
          </div>

          {isOpen && (
            <div className="absolute top-full left-0 right-0 z-50 mt-1 max-h-60 overflow-y-auto rounded-2xl border border-emerald-100 bg-white p-2 shadow-2xl dark:border-neutral-700 dark:bg-neutral-900">
              <div className="px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-emerald-800 dark:text-emerald-400">
                {isPickup ? '📍 পিকআপ পয়েন্ট নির্বাচন করুন' : '🏁 গন্তব্যস্থল নির্বাচন করুন'} ({filtered.length} locations)
              </div>
              <div className="space-y-1 mt-1">
                {filtered.map(loc => {
                  const isCurrent = selectedLocation?.id === loc.id;
                  let distBadge = null;
                  if (referenceLocation && !isPickup && referenceLocation.id !== loc.id) {
                    const { distanceKm } = calculateRouteDistance(referenceLocation.lat, referenceLocation.lng, loc.lat, loc.lng);
                    distBadge = `${distanceKm} কিমি`;
                  }
                  return (
                    <div
                      key={loc.id}
                      onClick={() => handleSelect(loc)}
                      className={`flex cursor-pointer items-center justify-between rounded-xl px-3 py-2 text-xs transition-all ${
                        isCurrent
                          ? 'bg-emerald-700 text-white font-bold'
                          : 'hover:bg-emerald-50 text-gray-800 dark:text-neutral-200 dark:hover:bg-neutral-800'
                      }`}
                    >
                      <div className="flex items-center gap-2.5 min-w-0">
                        <span className={isCurrent ? 'text-amber-300' : 'text-emerald-600'}>📍</span>
                        <div className="min-w-0">
                          <div className="font-extrabold truncate">{loc.name}</div>
                          <div className={`text-[10px] truncate ${isCurrent ? 'text-emerald-100' : 'text-gray-500 dark:text-neutral-400'}`}>
                            {loc.landmark} • <span className="font-semibold">{loc.area}</span>

                            {distBadge}
                          </span>
                        )}
                        {isCurrent && <span>✓</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- LIVE MAP COMPONENT ---
    const LiveMap = ({ isSimulating }) => {
      const { route, adminPricing } = useApp();
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const driverMarkerRef = useRef(null);
      const animIntervalRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, { zoomControl: false, attributionControl: false }).setView([23.8103, 90.4125], 13);
          L.control.zoom({ position: 'bottomright' }).addTo(map);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;
        map.invalidateSize();
        map.eachLayer(l => { if (l instanceof L.Marker || l instanceof L.Polyline) map.removeLayer(l); });

        const p = route.pickup;
        const d = route.dest;

        const pIcon = L.divIcon({
          className: 'custom-map-pin pin-pickup',
          html: '<div style="background:#059669;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 0 10px rgba(5,150,105,0.6);border:2px solid #fff;">●</div>',
          iconSize: [24, 24], iconAnchor: [12, 12],
        });
        const dIcon = L.divIcon({
          className: 'custom-map-pin pin-dest',
          html: '<div style="background:#e11d48;color:#fff;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 0 10px rgba(225,29,72,0.6);border:2px solid #fff;">■</div>',
          iconSize: [24, 24], iconAnchor: [12, 12],
        });

        L.marker([p.lat, p.lng], { icon: pIcon }).addTo(map).bindPopup(`<b>পিকআপ:</b> ${p.name}`);
        L.marker([d.lat, d.lng], { icon: dIcon }).addTo(map).bindPopup(`<b>গন্তব্য:</b> ${d.name}`);

        const midLat = (p.lat + d.lat) / 2 + 0.004;
        const midLng = (p.lng + d.lng) / 2 - 0.005;

        L.polyline([[p.lat, p.lng], [midLat, midLng], [d.lat, d.lng]], {
          color: '#059669', weight: 5, dashArray: '6, 6',
        }).addTo(map);

        const bounds = L.latLngBounds([[p.lat, p.lng], [d.lat, d.lng]]);
        map.fitBounds(bounds, { padding: [55, 55], maxZoom: 15 });
      }, [route]);

      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map || !isSimulating) {
          if (animIntervalRef.current) clearInterval(animIntervalRef.current);
          if (driverMarkerRef.current && map) {
            map.removeLayer(driverMarkerRef.current);
            driverMarkerRef.current = null;
          }
          return;
        }

        let dLat = route.pickup.lat + 0.008;
        let dLng = route.pickup.lng + 0.006;
        const carIcon = L.divIcon({
          className: 'custom-car-marker',
          html: '<div style="font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));">🛺</div>',
          iconSize: [30, 30], iconAnchor: [15, 15],
        });

        if (driverMarkerRef.current) map.removeLayer(driverMarkerRef.current);
        driverMarkerRef.current = L.marker([dLat, dLng], { icon: carIcon }).addTo(map);

        let steps = 0;
        const total = 14;
        clearInterval(animIntervalRef.current);
        animIntervalRef.current = setInterval(() => {
          steps++;
          const progress = steps / total;
          const curLat = dLat + (route.pickup.lat - dLat) * progress;
          const curLng = dLng + (route.pickup.lng - dLng) * progress;
          if (driverMarkerRef.current) driverMarkerRef.current.setLatLng([curLat, curLng]);
          if (steps >= total) clearInterval(animIntervalRef.current);
        }, 1200);

        return () => { if (animIntervalRef.current) clearInterval(animIntervalRef.current); };
      }, [isSimulating, route]);

      return (
        <div className="relative h-full min-h-[580px] w-full overflow-hidden rounded-3xl border border-emerald-100 shadow-md dark:border-neutral-800">
          <div ref={mapContainerRef} className="h-full w-full" />
          <div className="pointer-events-none absolute top-4 left-4 right-4 z-[400] flex items-center justify-between">
            <div className="pointer-events-auto flex items-center gap-2 rounded-full border border-emerald-200 bg-white/95 px-4 py-2 text-xs font-bold text-gray-900 shadow-md dark:border-neutral-700 dark:bg-neutral-900/95 dark:text-white">
              <span className="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-ping" />
              <span>রুট: {route.pickup.name.split('(')[0]} ➔ {route.dest.name.split('(')[0]}</span>
            </div>
          </div>
          <div className="absolute bottom-4 left-4 right-4 z-[400] flex items-center justify-around rounded-2xl border border-emerald-100 bg-white/95 py-3 px-4 shadow-xl backdrop-blur-md dark:border-neutral-800 dark:bg-neutral-900/95">
            <div className="text-center">
              <span className="block text-[10px] font-bold uppercase tracking-wider text-gray-400">মোট দূরত্ব</span>
              <strong className="text-sm font-extrabold text-emerald-800 dark:text-emerald-400">{route.distanceKm} কিমি</strong>
            </div>
            <div className="h-7 w-px bg-gray-200 dark:bg-neutral-800" />
            <div className="text-center">
              <span className="block text-[10px] font-bold uppercase tracking-wider text-gray-400">আনুমানিক সময়</span>
              <strong className="text-sm font-extrabold text-gray-900 dark:text-white">~{route.durationMins} মিনিট</strong>
            </div>
            <div className="h-7 w-px bg-gray-200 dark:bg-neutral-800" />
            <div className="text-center">
              <span className="block text-[10px] font-bold uppercase tracking-wider text-gray-400">বিকাশ ক্যাশব্যাক</span>
              <strong className="text-sm font-extrabold text-emerald-600 dark:text-emerald-400">৳ {adminPricing.bkashCashback}</strong>
            </div>
          </div>
        </div>
      );
    };

                <p className="mt-1 text-xs text-gray-500">{route.pickup.name.split('(')[0]} এলাকার সেরা রেটেড চালক খোঁজা হচ্ছে</p>
                <button onClick={onClose} className="mt-6 rounded-full border border-gray-300 px-6 py-2 text-xs font-bold">বাতিল করুন</button>

            {stage === 'matched' && (

                  <span className="rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-800">২ মিনিটের মধ্যে পৌঁছাবে</span>
                  <span className="text-xs font-bold text-gray-500">{vehicleInfo.name}</span>
                </div>
                <div className="flex items-center gap-4 rounded-2xl bg-emerald-50/60 p-4 border border-emerald-100">
                  <div className="text-3xl">👨‍✈️</div>
                  <div className="flex-1">
                    <h4 className="font-extrabold text-gray-900">{driver.name} ★ 4.95</h4>
                    <div className="text-xs text-emerald-800 font-medium">{driver.vehicle}</div>
                  </div>
                </div>
                <div className="flex justify-between border p-3 rounded-xl text-xs">
                  <span>নির্ধারিত মোট ভাড়া:</span>
                  <strong className="text-emerald-800 font-extrabold">৳ {finalFare}</strong>
                </div>
                <button onClick={() => setStage('completed')} className="w-full rounded-xl bg-emerald-700 py-3 text-xs font-bold text-white shadow-lg">রাইড সম্পন্ন করুন (সিমুলেশন)</button>
              </div>

            {stage === 'completed' && (
              <div className="flex flex-col items-center py-4 text-center">
                <div className="text-4xl mb-2">🎉</div>
                <h3 className="text-xl font-extrabold text-gray-900">গন্তব্যে পৌঁছে গেছেন!</h3>
                <p className="mt-1 text-xs text-gray-500">ভাড়া ৳ {finalFare} ওভাই পে দিয়ে পরিশোধ সম্পন্ন হয়েছে।</p>
                <button onClick={onClose} className="mt-4 w-full rounded-xl bg-emerald-700 py-3 text-xs font-bold text-white">সম্পন্ন ও ৫ স্টার দিন ★</button>
              </div>

    // --- CUSTOMER ACCOUNT MODAL ---
    const CustomerAccountModal = ({ isOpen, onClose, initialTab }) => {

      const [activeTab, setActiveTab] = useState(initialTab || 'coupons');
      const [topupInput, setTopupInput] = useState('500');
      const [disputeCategory, setDisputeCategory] = useState('CNG Meter Disconnected');
      const [disputeTripId, setDisputeTripId] = useState('OBHAI-CNG-8492');
      const [disputeDetails, setDisputeDetails] = useState('');

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
          <div className="flex h-[85vh] max-h-[600px] w-full max-w-2xl flex-col rounded-3xl border border-emerald-100 bg-white shadow-2xl dark:border-neutral-800 dark:bg-neutral-900 overflow-hidden">
            <div className="flex items-center justify-between border-b px-6 py-4 bg-emerald-50/50">
              <h3 className="text-base font-extrabold text-gray-900">{customer.name}</h3>
              <button onClick={onClose} className="rounded-full p-2 text-gray-400">✕</button>
            </div>
            <div className="flex border-b px-6">
              <button onClick={() => setActiveTab('coupons')} className={`py-3 px-3 text-xs font-black border-b-2 ${activeTab === 'coupons' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-gray-500'}`}>কুপন ও প্রোমো ({coupons.length})</button>
              <button onClick={() => setActiveTab('wallet')} className={`py-3 px-3 text-xs font-black border-b-2 ${activeTab === 'wallet' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-gray-500'}`}>ওয়ালেট (৳ {Math.round(customer.walletBalance)})</button>
              <button onClick={() => setActiveTab('disputes')} className={`py-3 px-3 text-xs font-black border-b-2 ${activeTab === 'disputes' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-gray-500'}`}>অভিযোগ ({disputes.length})</button>
            </div>
            <div className="flex-1 overflow-y-auto p-6">
              {activeTab === 'coupons' && (

              <div className="space-y-3">
                <div onClick={() => setSelectedAuthRole('customer')} className={`flex cursor-pointer items-center justify-between rounded-2xl border-2 p-3.5 ${selectedAuthRole === 'customer' ? 'border-emerald-600 bg-emerald-50/70' : 'border-gray-200'}`}>
                  <div className="flex items-center gap-3"><span className="text-2xl">👤</span><div><h3 className="text-sm font-extrabold">ওভাই যাত্রী (Passenger)</h3><p className="text-xs text-gray-500">সিএনজি ও কার বুকিং, প্রোমো কোড ও ওয়ালেট</p></div></div>
                </div>
                <div onClick={() => setSelectedAuthRole('driver')} className={`flex cursor-pointer items-center justify-between rounded-2xl border-2 p-3.5 ${selectedAuthRole === 'driver' ? 'border-emerald-600 bg-emerald-50/70' : 'border-gray-200'}`}>
                  <div className="flex items-center gap-3"><span className="text-2xl">👨‍✈️</span><div><h3 className="text-sm font-extrabold">ওভাই ক্যাপ্টেন / চালক</h3><p className="text-xs text-gray-500">ট্রিপ গ্রহণ, ডিজিটাল মিটার ও ইনকাম</p></div></div>
                </div>
                <div onClick={() => setSelectedAuthRole('admin')} className={`flex cursor-pointer items-center justify-between rounded-2xl border-2 p-3.5 ${selectedAuthRole === 'admin' ? 'border-emerald-600 bg-emerald-50/70' : 'border-gray-200'}`}>
                  <div className="flex items-center gap-3"><span className="text-2xl">🛡️</span><div><h3 className="text-sm font-extrabold">ওভাই হেডকোয়ার্টার অ্যাডমিন</h3><p className="text-xs text-gray-500">প্রাইসিং কন্ট্রোল ও রিফান্ড ম্যানেজমেন্ট</p></div></div>
                </div>
              </div>
              <button onClick={() => enterPortal(selectedAuthRole)} className="w-full bg-emerald-700 text-white py-3.5 rounded-xl font-bold shadow-lg">প্রবেশ করুন ➔</button>
              <div className="border-t pt-3 flex gap-2 justify-center">
                <button onClick={() => enterPortal('customer')} className="border px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-800">🧑‍💼 যাত্রী</button>
                <button onClick={() => enterPortal('driver')} className="border px-3 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-800">👨‍✈️ ক্যাপ্টেন</button>
                <button onClick={() => enterPortal('admin')} className="border px-3 py-1 rounded-full text-xs font-bold bg-gray-100">🛡️ অ্যাডমিন</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN APP ---
    const App = () => {
      const { currentScreen, theme, toggleTheme, logOutToGate, customer, driver, toasts } = useApp();
      return (
        <div className="flex min-h-screen flex-col bg-slate-50 text-slate-900 dark:bg-neutral-950 dark:text-neutral-100">
          {currentScreen === 'auth' ? <AuthGate /> : (
            <>
              <header className="sticky top-0 z-40 w-full border-b border-emerald-100 bg-white px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-sm">
                <div className="flex items-center gap-2">
                  <span className="flex h-8 w-8 items-center justify-center rounded-xl bg-emerald-700 text-white font-black">ও</span>
                  <span className="text-xl font-black text-emerald-950">OBHAI ওভাই</span>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={toggleTheme} className="border p-2 rounded-full text-xs">{theme === 'light' ? '🌙' : '☀️'}</button>
                  <button onClick={logOutToGate} className="border border-red-200 bg-red-50 text-red-600 px-3 py-1.5 rounded-full text-xs font-bold">লগ আউট</button>
                </div>
              </header>
              <main className="flex flex-1 flex-col">
                {currentScreen === 'customer' && <CustomerPortal />}
                {currentScreen === 'driver' && <DriverPortal />}
                {currentScreen === 'admin' && <AdminPortal />}
              </main>
            </>
          )}
          {toasts.length > 0 && (
            <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2">
              {toasts.map(t => (
                <div key={t.id} className="bg-emerald-950 text-white px-4 py-3 rounded-2xl text-xs font-bold shadow-xl border border-emerald-700">
                  {t.message}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
